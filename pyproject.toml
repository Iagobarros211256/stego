[project]
name = "stego"
version = "0.1.0"
description = "Base de conhecimento pessoal, local, com busca hibrida e resposta ancorada"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stego = "stego.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stego"]
